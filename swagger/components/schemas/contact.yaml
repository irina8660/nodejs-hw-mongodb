type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: 'Contact`s unique ID (MongoDB ObjectId)'
    type: string
    example: 686809896ac14799aa90b54a
  userId:
    description: 'ID of the user who owns this contact (MongoDB ObjectId)'
    type: string
    example: 686809896ac14799aa90b54a
  name:
    description: 'Contact`s name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact`s phone number'
    type: string
    example: '+380730737373'
  email:
    description: 'Contact`s email'
    type: string
    example: 'example@mail.com'
  isFavourite:
    description: 'Whether is contact a favourite'
    type: boolean
    example: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
  photo:
    description: 'Link to the contact`s photo'
    type: string
    format: uri
    example: https://res.cloudinary.com/dsd3a9vxa/image/upload/v1752525617/%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA_%D1%8D%D0%BA%D1%80%D0%B0%D0%BD%D0%B0_2025-07-14_%D0%B2_19.28.27_tnv0eo.png
